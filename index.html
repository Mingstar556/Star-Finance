<!DOCTYPE html>
<html lang="en" data-theme="royal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Star Finance — a professional personal finance dashboard. Track balances, spending and investments in one place." />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Star Finance — Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0f'/%3E%3Cpath d='M16 5l2.6 7.2L26 15l-7.4 2.8L16 25l-2.6-7.2L6 15l7.4-2.8z' fill='%23d4af37'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ===================== AUTH SCREEN ===================== -->
  <div id="auth-root" class="auth-root hidden" aria-label="Sign in"></div>

  <!-- ===================== APP SHELL ===================== -->
  <div id="app" class="app hidden">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-logo" id="brandLogo"></span>
        <span class="brand-text">
          <span class="brand-name">Star <em>Finance</em></span>
          <span class="brand-sub">Wealth, in orbit.</span>
        </span>
        <button class="btn-icon only-mobile" id="closeNav" aria-label="Close menu"></button>
      </div>

      <nav class="nav" id="nav">
        <p class="nav-section">Overview</p>
        <a class="nav-item" href="#/dashboard" data-route="dashboard"><span class="nav-icon" data-icon="grid"></span><span class="nav-label">Dashboard</span></a>
        <a class="nav-item" href="#/analytics" data-route="analytics"><span class="nav-icon" data-icon="chart"></span><span class="nav-label">Analytics</span></a>
        <p class="nav-section">Manage</p>
        <a class="nav-item" href="#/transactions" data-route="transactions"><span class="nav-icon" data-icon="list"></span><span class="nav-label">Transactions</span></a>
        <a class="nav-item" href="#/settings" data-route="settings"><span class="nav-icon" data-icon="gear"></span><span class="nav-label">Settings</span></a>
      </nav>

      <div class="side-foot">
        <div class="side-user">
          <span class="avatar" id="sideAvatar"></span>
          <span class="side-user-meta">
            <strong id="sideName">—</strong>
            <small id="sideEmail">—</small>
          </span>
          <button class="btn-icon" id="logoutBtn" title="Log out" aria-label="Log out"></button>
        </div>
        <p class="side-note">Data stays in your browser — demo build.</p>
      </div>
    </aside>
    <div class="sidebar-scrim" id="scrim" tabindex="-1"></div>

    <!-- Main column -->
    <div class="main">
      <header class="topbar">
        <button class="btn-icon only-mobile" id="menuBtn" aria-label="Open menu"></button>
        <div class="page-head">
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
          <p class="page-sub" id="pageSub"></p>
        </div>
        <div class="topbar-actions">
          <button class="btn-icon" id="themeBtn" title="Switch theme" aria-label="Switch theme"></button>
          <button class="btn btn-primary btn-add" id="addBtn"><span data-icon="plus"></span><span class="btn-add-label">Add</span></button>
          <div class="avatar-menu" id="avatarMenu">
            <button class="avatar" id="topAvatar" aria-haspopup="true" aria-expanded="false" aria-label="Account menu"></button>
            <div class="menu-pop hidden" id="menuPop" role="menu">
              <div class="menu-id">
                <strong id="menuName">—</strong>
                <small id="menuEmail">—</small>
              </div>
              <button class="menu-item" data-act="settings" role="menuitem"><span data-icon="gear"></span>Settings</button>
              <button class="menu-item" data-act="theme" role="menuitem"><span data-icon="moon"></span>Switch theme</button>
              <hr />
              <button class="menu-item danger" data-act="logout" role="menuitem"><span data-icon="logout"></span>Log out</button>
            </div>
          </div>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Modal + toast roots -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-wrap" aria-live="polite"></div>
  <div id="chart-tip" class="chart-tip hidden" role="status"></div>

  <script src="js/util.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
